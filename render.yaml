services:
  - type: web
    name: nl-test-runner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: NLQA_HEADLESS
        value: "true"
      - key: WEB_MAX_SECONDS
        value: "180"
      - key: WEB_MAX_STEPS
        value: "24"
