services:
  - type: web
    name: nl-test-runner
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NLQA_HEADLESS
        value: "true"
      - key: NLQA_MAX_ELEMENTS
        value: "30"
      - key: NLQA_MAX_TOKENS
        value: "512"
      - key: WEB_MAX_SECONDS
        value: "600"
      - key: WEB_MAX_STEPS
        value: "24"
      - key: WEB_MAX_RUNS_PER_HOUR
        value: "10"
