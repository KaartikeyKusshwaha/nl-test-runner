[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-test-runner"
version = "0.1.0"
description = "A generic plain-English browser test runner with evidence-gated verdicts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1.6",
  "playwright>=1.64.1",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "python-dotenv>=1.2.1",
  "rich>=15.0.0",
]

[project.optional-dependencies]
openai = ["openai>=3.46.0"]
anthropic = ["anthropic>=2.6.0"]
dev = [
  "anthropic>=2.6.0",
  "openai>=3.46.0",
  "pytest>=9.2.0",
  "pytest-timeout>=2.4.0",
  "ruff>=0.17.4",
]

[project.scripts]
nlqa = "nlqa.cli:main"

[tool.setuptools.packages.find]
include = ["nlqa*"]

[tool.setuptools.package-data]
nlqa = ["snapshot.js", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires internet and a configured LLM provider"]
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
